
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая категория — WishList</title>
    <link rel="stylesheet" href="{% static 'wishlist/style.css' %}">
</head>
<body>

<header class="site-header">
    <a class="brand" href="{% url 'home' %}">wish<span>list</span></a>
    <nav class="main-nav">
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'wishlist_list' %}">Мои желания</a>
        <a href="{% url 'category_list' %}">Категории</a>
        <a href="{% url 'purchased_list' %}">Купленные</a>
    </nav>
</header>

<main class="page-shell form-shell">
    <section class="form-heading">
        <span class="eyebrow">НАВЕДЁМ ПОРЯДОК В МЕЧТАХ</span>
        <h1>Новая <em>категория</em> ✧</h1>
        <p>Создай отдельную полочку для своих желаний.</p>
    </section>

    <form class="wish-form" method="POST">
        {% csrf_token %}

        <div class="form-field">
            <label for="name">Название категории</label>
            <input
                id="name"
                type="text"
                name="name"
                placeholder="Например, Красота и уход"
                required
            >
        </div>

        <div class="form-field">
            <label for="description">Описание</label>
            <textarea
                id="description"
                name="description"
                rows="4"
                placeholder="Что будет храниться в этой категории?"
            ></textarea>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Создать категорию</button>
            <a class="text-link" href="{% url 'category_list' %}">Отмена</a>
        </div>
    </form>
</main>

</body>
</html>

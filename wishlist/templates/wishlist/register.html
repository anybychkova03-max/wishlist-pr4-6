{% extends "wishlist/base.html" %}

{% block title %}Регистрация — WishList{% endblock %}

{% block content %}
<main class="page-shell">
    <section class="form-container">
        <h1>Создать аккаунт ♡</h1>
        <p>Зарегистрируйся, чтобы хранить свои мечты.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button button-primary">Зарегистрироваться</button>
        </form>
        <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </section>
</main>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое желание — WishList</title>
    <link rel="stylesheet" href="{% static 'wishlist/style.css' %}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="{% url 'home' %}">wish<span>list</span></a>
    <nav class="main-nav">
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'wishlist_list' %}">Мои желания</a>
        <a href="{% url 'category_list' %}">Категории</a>
        <a href="{% url 'purchased_list' %}">Купленные</a>
    </nav>
</header>

<main class="page-shell form-shell">
    <section class="form-heading">
        <span class="eyebrow">ЕЩЁ ОДНА МЕЧТА В ТВОЁМ СПИСКЕ</span>
        <h1>Добавить <em>желание</em></h1>
        <p>Сохрани идею, чтобы не потерять её среди повседневных дел.</p>
    </section>

    <form class="wish-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-field">
            <label for="title">Название товара</label>
            <input id="title" type="text" name="title" placeholder="Например, наушники" required>
        </div>
        <div class="form-field">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="4" placeholder="Цвет, модель или почему тебе это нравится…"></textarea>
        </div>
        <div class="form-row">
            <div class="form-field">
                <label for="price">Стоимость, ₽</label>
                <input id="price" type="number" name="price" step="0.01" min="0" placeholder="0.00" required>
            </div>
            <div class="form-field">
                <label for="category">Категория</label>
                <select id="category" name="category">
                    <option value="">Без категории</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-field">
            <label for="url">Ссылка на товар</label>
            <input id="url" type="url" name="url" placeholder="https://…">
        </div>
        <div class="form-field">
            <label for="image">Фотография</label>
            <input id="image" type="file" name="image" accept="image/*">
            <small>Можно загрузить JPG, PNG или WebP.</small>
        </div>
        <div class="form-field">
            <label for="priority">Насколько сильно хочется?</label>
            <select id="priority" name="priority">
                <option value="high">Очень хочу</option>
                <option value="medium" selected>Будет приятно</option>
                <option value="low">Когда-нибудь</option>
            </select>
        </div>
        <div class="form-actions">
            <button class="button button-primary" type="submit">Сохранить желание ♡</button>
            <a class="text-link" href="{% url 'wishlist_list' %}">Отмена</a>
        </div>
    </form>
</main>
<footer class="site-footer">Пусть мечты становятся планами ♡</footer>
</body>
</html>
